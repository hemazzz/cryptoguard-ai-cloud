<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoGuard AI</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1d3a, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      background: rgba(0, 0, 0, 0.55);
      padding: 30px;
      width: 360px;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.35);
      text-align: center;
    }

    h1 {
      margin-bottom: 6px;
      color: #3cc9ff;
    }

    p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #020617;
      color: white;
      box-shadow: inset 0 0 5px rgba(0, 200, 255, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 15px;
      white-space: pre-line;
      font-size: 14px;
      min-height: 60px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>CryptoGuard AI</h1>
    <p>Bitcoin & Ethereum Whale Detection System</p>

    <input
      type="text"
      id="address"
      placeholder="Enter BTC / ETH Address"
    />

    <select id="chain">
      <option value="BTC">Bitcoin (BTC)</option>
      <option value="ETH">Ethereum (ETH)</option>
    </select>

    <button id="verifyBtn">Verify Address</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
