<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoGuard AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #0a2540, #020617);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .card {
      width: 360px;
      padding: 25px;
      background: #020617;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 153, 255, 0.4);
      text-align: center;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 5px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #020617;
      color: #fff;
      border: 1px solid #1e293b;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
    }

    .error {
      color: #ef4444;
    }

    .success {
      color: #22c55e;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>CryptoGuard AI</h1>
    <p>Bitcoin & Ethereum Whale Detection System</p>

    <input id="address" placeholder="Enter BTC / ETH Address" />

    <select id="chain">
      <option value="BTC">Bitcoin (BTC)</option>
      <option value="ETH">Ethereum (ETH)</option>
    </select>

    <button onclick="verifyAddress()">Verify Address</button>

    <div id="output" class="result"></div>
  </div>

  <script>
    const API_BASE = "https://cryptoguard-ai-cloud-1.onrender.com";

    function isValidBTC(addr) {
      return /^[13][a-km-zA-HJ-NP-Z1-9]{25,34}$/.test(addr);
    }

    function isValidETH(addr) {
      return /^0x[a-fA-F0-9]{40}$/.test(addr);
    }

    async function verifyAddress() {
      const address = document.getElementById("address").value.trim();
      const chain = document.getElementById("chain").value;
      const output = document.getElementById("output");

      output.innerHTML = "";

      if (!address) {
        output.innerHTML = `<span class="error">Address required</span>`;
        return;
      }

      if (chain === "BTC" && !isValidBTC(address)) {
        output.innerHTML = `<span class="error">Invalid BTC address</span>`;
        return;
      }

      if (chain === "ETH" && !isValidETH(address)) {
        output.innerHTML = `<span class="error">Invalid ETH address</span>`;
        return;
      }

      output.innerHTML = "Checking blockchain data...";

      try {
        const res = await fetch(`${API_BASE}/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ address, chain })
        });

        const data = await res.json();

        if (!res.ok) {
          output.innerHTML = `<span class="error">${data.detail || "API error"}</span>`;
          return;
        }

        output.innerHTML = `
          <div class="success">
            Chain: ${data.chain}<br>
            Balance: ${data.balance}<br>
            Transactions: ${data.transactions}<br>
            Status: ${data.result}
          </div>
        `;
      } catch (err) {
        output.innerHTML = `<span class="error">Backend not reachable</span>`;
      }
    }
  </script>

</body>
</html>
