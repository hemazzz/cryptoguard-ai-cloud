<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CryptoGuard AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #e5e7eb;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5f5;
        }

        .card {
            background-color: #020617;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(56,189,248,0.3);
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }

        input, select {
            background-color: #020617;
            color: #e5e7eb;
            border: 1px solid #334155;
        }

        button {
            background-color: #38bdf8;
            color: #020617;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0ea5e9;
        }

        #result {
            margin-top: 20px;
            text-align: left;
            background-color: #020617;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <h1>CryptoGuard AI</h1>
    <p>Bitcoin & Ethereum Whale Detection System</p>

    <div class="card">
        <input 
            id="address" 
            type="text" 
            placeholder="Enter BTC / ETH Address">

        <select id="chain">
            <option value="BTC">Bitcoin (BTC)</option>
            <option value="ETH">Ethereum (ETH)</option>
        </select>

        <button onclick="verifyAddress()">Verify Address</button>

        <div id="result"></div>
    </div>

    <script>
        async function verifyAddress() {
            const address = document.getElementById("address").value.trim();
            const chain = document.getElementById("chain").value;
            const resultDiv = document.getElementById("result");

            if (address === "") {
                resultDiv.innerHTML = "<b style='color:red'>Please enter an address</b>";
                return;
            }

            resultDiv.innerHTML = "Checking blockchain data... ⏳";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/verify",   // 🔁 change to Render URL later
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            address: address,
                            chain: chain
                        })
                    }
                );

                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<b style="color:red">${data.error}</b>`;
                    return;
                }

                resultDiv.innerHTML = `
                    <b>Chain:</b> ${data.chain}<br>
                    <b>Balance:</b> ${data.balance}<br>
                    ${data.transactions !== undefined 
                        ? `<b>Transactions:</b> ${data.transactions}<br>` 
                        : ""
                    }
                    <b>Status:</b> ${data.result}
                `;

            } catch (err) {
                resultDiv.innerHTML = "<b style='color:red'>Backend not reachable</b>";
            }
        }
    </script>

</body>
</html>
